<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>舒尔特表 - 脑训练</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/detail.css">
    <script src="/js/theme.js"></script>
    <script src="/js/starfield.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="card">
        <div class="top-bar">
            <div class="back-btn" onclick="location.href='/'">←</div>
            <h1 class="page-title">舒尔特表</h1>
        </div>

        <div class="levels">
            <div class="level-card" onclick="startGame('beginner')">
                <div class="name">初级</div>
                <div class="grid-info">3×3</div>
            </div>
            <div class="level-card" onclick="startGame('intermediate')">
                <div class="name">中级</div>
                <div class="grid-info">4×4</div>
            </div>
            <div class="level-card" onclick="startGame('advanced')">
                <div class="name">高级</div>
                <div class="grid-info">5×5</div>
            </div>
        </div>

        <!-- 玩法说明 -->
        <div class="how-to-play">
            <h2 class="section-title">📖 玩法说明</h2>
            <ul class="rules">
                <li>方格内数字随机打乱</li>
                <li>按 1、2、3... 顺序依次点击</li>
                <li>点击错误会扣分</li>
                <li>用时越短，得分越高</li>
            </ul>
        </div>

        <h2 class="section-title">最近成绩</h2>
        <ul class="record-list" id="record-list">
            <li class="empty">加载中...</li>
        </ul>
    </div>

    <script>
        const userId = localStorage.getItem("user_id");
        if (!userId) {
            location.href = "/login.html";
        }

        function startGame(level) {
            location.href = "/schulte.html?level=" + level;
        }

        function loadRecords() {
            fetch("/api/records?limit=10&user_id=" + userId)
                .then(res => res.json())
                .then(records => {
                    // ✅ 只显示 schulte 的成绩
                    const filtered = records.filter(r => r.game === "schulte");
                    const list = document.getElementById("record-list");
                    if (filtered.length === 0) {
                        list.innerHTML = '<li class="empty">还没有成绩，快去玩一局吧！</li>';
                        return;
                    }
                    list.innerHTML = "";
                    filtered.forEach(r => {
                        const li = document.createElement("li");
                        const timeStr = r.created_at.substring(5, 16);
                        const levelNames = { beginner: "初级", intermediate: "中级", advanced: "高级" };
                        const levelName = levelNames[r.level] || r.level;
                        li.innerHTML = `
                            <span class="time-text">${timeStr} · ${levelName}</span>
                            <span class="duration">${r.duration} 秒</span>
                        `;
                        list.appendChild(li);
                    });
                })
                .catch(err => {
                    console.error("加载失败：", err);
                    document.getElementById("record-list").innerHTML =
                        '<li class="empty">加载失败，请刷新试试</li>';
                });
        }

        loadRecords();
    </script>

</body>
</html>
