<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 脑训练</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/theme.js"></script>
    <script src="/js/starfield.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
        <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    <div class="card">
        <h1>脑训练</h1>
        <p class="subtitle">登录你的账号</p>

        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>

        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>

        <button class="btn-primary" id="login-btn" onclick="handleLogin()">登 录</button>

        <div class="message" id="message"></div>

        <div class="link">
            还没有账号？ <a href="/register.html">去注册</a>
        </div>
    </div>

    <script>
        function handleLogin() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");
            const btn = document.getElementById("login-btn");

            if (!username || !password) {
                message.textContent = "请输入用户名和密码";
                message.className = "message error";
                return;
            }

            btn.disabled = true;
            btn.textContent = "登录中...";
            message.textContent = "";

            fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "ok") {
                    localStorage.setItem("user_id", data.user_id);
                    localStorage.setItem("username", data.username);
                    message.textContent = "✅ 登录成功，正在跳转...";
                    message.className = "message success";
                    setTimeout(() => {
                        location.href = "/";
                    }, 1000);
                } else {
                    message.textContent = "❌ " + data.message;
                    message.className = "message error";
                    btn.disabled = false;
                    btn.textContent = "登 录";
                }
            })
            .catch(err => {
                message.textContent = "❌ 网络错误，请重试";
                message.className = "message error";
                btn.disabled = false;
                btn.textContent = "登 录";
            });
        }
    </script>

</body>
</html>
