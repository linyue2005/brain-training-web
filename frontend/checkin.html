<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>打卡 - 脑训练</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/checkin.css">
    <script src="/js/theme.js"></script>
    <script src="/js/starfield.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="card">
        <div class="top-bar">
            <div class="back-btn" onclick="location.href='/'">←</div>
            <h1 class="page-title">打卡记录</h1>
        </div>

        <!-- 连续打卡大卡片 -->
        <div class="continuous-card">
            <div class="fire">🔥</div>
            <div class="continuous-num" id="continuous-days">0</div>
            <div class="continuous-label">连续打卡天数</div>
        </div>

        <!-- 最近 7 天 -->
        <h2 class="section-title">最近 7 天</h2>
        <div class="week-grid" id="week-grid"></div>

        <!-- 汇总 -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-num" id="month-days">0</div>
                <div class="stat-label">本月打卡</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" id="total-days">0</div>
                <div class="stat-label">累计打卡</div>
            </div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem("user_id");
        if (!userId) {
            location.href = "/login.html";
        }

        // 星期名
        const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

        fetch("/api/checkin/status?user_id=" + userId)
            .then(res => res.json())
            .then(data => {
                // 连续天数
                document.getElementById("continuous-days").textContent = data.continuous_days;
                // 本月/累计
                document.getElementById("month-days").textContent = data.month_days;
                document.getElementById("total-days").textContent = data.total_days;

                // 最近 7 天
                const grid = document.getElementById("week-grid");
                grid.innerHTML = "";
                const today = new Date();
                for (let i = 0; i < 7; i++) {
                    // 从 6 天前到今天
                    const offset = 6 - i;
                    const d = new Date(today);
                    d.setDate(today.getDate() - offset);
                    const weekName = WEEKDAYS[d.getDay()];
                    const dateNum = d.getDate();
                    const checked = data.recent_7_days[i] === 1;

                    const box = document.createElement("div");
                    box.className = "day-box" + (checked ? " checked" : "");
                    box.innerHTML = `
                        <div class="week-name">${weekName}</div>
                        <div class="date-num">${dateNum}</div>
                        <div class="check-mark">${checked ? "✓" : ""}</div>
                    `;
                    grid.appendChild(box);
                }
            })
            .catch(err => {
                console.error("加载失败：", err);
            });
    </script>

</body>
</html>
