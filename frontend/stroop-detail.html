<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Stroop 色词 - 脑训练</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/detail.css">
    <script src="/js/theme.js"></script>
    <script src="/js/starfield.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="card">
        <div class="top-bar">
            <div class="back-btn" onclick="location.href='/'">←</div>
            <h1 class="page-title">Stroop 色词</h1>
        </div>

        <div class="levels">
            <div class="level-card stroop-level" onclick="startGame('beginner')">
                <div class="name">初级</div>
                <div class="grid-info">10 题</div>
            </div>
            <div class="level-card stroop-level" onclick="startGame('intermediate')">
                <div class="name">中级</div>
                <div class="grid-info">20 题 · 4秒</div>
            </div>
            <div class="level-card stroop-level" onclick="startGame('advanced')">
                <div class="name">高级</div>
                <div class="grid-info">30 题 · 2秒</div>
            </div>
        </div>

        <div class="how-to-play">
            <h2 class="section-title">📖 玩法说明</h2>
            <ul class="rules">
                <li>屏幕中央会出现一个汉字</li>
                <li>字的颜色和字义不同</li>
                <li>选择文字的<strong>颜色</strong>，而非字义</li>
                <li>限时内点得越快越准，分数越高</li>
            </ul>
        </div>
        <h2 class="section-title">最近成绩</h2>
        <ul class="record-list" id="record-list">
            <li class="empty">加载中...</li>
        </ul>
    </div>

    <script>
        const userId = localStorage.getItem("user_id");
        if (!userId) {
            location.href = "/login.html";
        }

        function startGame(level) {
            location.href = "/stroop.html?level=" + level;
        }

        // 加载 Stroop 的成绩
        function loadRecords() {
            fetch("/api/records?limit=10&user_id=" + userId)
                .then(res => res.json())
                .then(records => {
                    // 只显示 game=stroop 的
                    const filtered = records.filter(r => r.game === "stroop");
                    const list = document.getElementById("record-list");
                    if (filtered.length === 0) {
                        list.innerHTML = '<li class="empty">还没有成绩，快去玩一局吧！</li>';
                        return;
                    }
                    list.innerHTML = "";
                    const levelNames = { beginner: "初级", intermediate: "中级", advanced: "高级" };
                    filtered.forEach(r => {
                        const li = document.createElement("li");
                        const timeStr = r.created_at.substring(5, 16);
                        const levelName = levelNames[r.level] || r.level;
                        li.innerHTML = `
                            <span class="time-text">${timeStr} · ${levelName}</span>
                            <span class="duration">${r.score} 分</span>
                        `;
                        list.appendChild(li);
                    });
                })
                .catch(err => {
                    console.error("加载失败：", err);
                    document.getElementById("record-list").innerHTML =
                        '<li class="empty">加载失败，请刷新试试</li>';
                });
        }

        loadRecords();
    </script>

</body>
</html>
